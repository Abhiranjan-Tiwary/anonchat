<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b14" />
    <title>AnonChat Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0b14;
        color: #e8eaf0;
        font-family: "Space Grotesk", system-ui, sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        background: #12131f;
        padding: 28px;
        text-align: center;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
      }
      img {
        width: 58px;
        height: 58px;
        border-radius: 16px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 24px;
      }
      p {
        margin: 0;
        color: rgba(232, 234, 240, 0.62);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/assets/logo/logo.png" alt="" />
      <h1>You are offline</h1>
      <p>AnonChat needs a connection for live messages and calls. Reconnect and this screen will recover automatically.</p>
    </main>
  </body>
</html>
